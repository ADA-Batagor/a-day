<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
  </defs>

  <!-- Views -->
  <rect x="300" y="20" width="380" height="64" rx="10" fill="#2b6cb0" />
  <text x="490" y="46" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Views  (SwiftUI)</text>
  <text x="490" y="66" text-anchor="middle" fill="#e2e8f0" font-size="12">CameraView, GalleryView, DetailView…</text>

  <line x1="490" y1="84" x2="490" y2="118" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ViewModels -->
  <rect x="320" y="120" width="340" height="64" rx="10" fill="#2f855a" />
  <text x="490" y="146" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">ViewModels</text>
  <text x="490" y="166" text-anchor="middle" fill="#e2e8f0" font-size="12">CameraViewModel  (@MainActor)</text>

  <line x1="490" y1="184" x2="490" y2="218" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Core/Services group -->
  <rect x="60" y="220" width="860" height="176" rx="10" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="80" y="242" fill="#718096" font-size="12" font-weight="600">Core/Services</text>

  <rect x="80" y="254" width="190" height="112" rx="8" fill="#805ad5" />
  <text x="175" y="278" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Camera</text>
  <text x="175" y="298" text-anchor="middle" fill="#e9d8fd" font-size="11">CameraManager</text>

  <rect x="290" y="254" width="190" height="112" rx="8" fill="#805ad5" />
  <text x="385" y="278" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Location</text>
  <text x="385" y="298" text-anchor="middle" fill="#e9d8fd" font-size="11">LocationManager</text>
  <text x="385" y="314" text-anchor="middle" fill="#e9d8fd" font-size="11">GeocodeManager</text>

  <rect x="500" y="254" width="190" height="112" rx="8" fill="#805ad5" />
  <text x="595" y="278" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Storage</text>
  <text x="595" y="298" text-anchor="middle" fill="#e9d8fd" font-size="11">StorageManager</text>
  <text x="595" y="314" text-anchor="middle" fill="#e9d8fd" font-size="11">ModelContainerService</text>
  <text x="595" y="330" text-anchor="middle" fill="#e9d8fd" font-size="11">DeletionService</text>

  <rect x="710" y="254" width="190" height="112" rx="8" fill="#805ad5" />
  <text x="805" y="278" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">System</text>
  <text x="805" y="298" text-anchor="middle" fill="#e9d8fd" font-size="11">NavigationManager</text>
  <text x="805" y="314" text-anchor="middle" fill="#e9d8fd" font-size="11">TimerManager</text>
  <text x="805" y="330" text-anchor="middle" fill="#e9d8fd" font-size="11">OrientationManager</text>
  <text x="805" y="346" text-anchor="middle" fill="#e9d8fd" font-size="11">HapticManager</text>

  <line x1="490" y1="396" x2="490" y2="428" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Models -->
  <rect x="300" y="430" width="380" height="86" rx="10" fill="#c05621" />
  <text x="490" y="454" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Models</text>
  <text x="490" y="474" text-anchor="middle" fill="#feebc8" font-size="12">Storage  (SwiftData @Model),  PlacemarkInfo</text>
  <text x="490" y="492" text-anchor="middle" fill="#feebc8" font-size="11">backed by the shared App Group container</text>

  <!-- widgetExtension -->
  <rect x="760" y="430" width="160" height="86" rx="10" fill="#2c7a7b" />
  <text x="840" y="458" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">widgetExtension</text>
  <text x="840" y="478" text-anchor="middle" fill="#b2f5ea" font-size="11">TimelineProvider</text>
  <text x="840" y="494" text-anchor="middle" fill="#b2f5ea" font-size="11">reads the same store</text>

  <line x1="680" y1="473" x2="754" y2="473" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="717" y="463" text-anchor="middle" fill="#718096" font-size="10">same store</text>

  <!-- WidgetCenter reload path: Storage service -> widgetExtension -->
  <path d="M 595 366 L 595 420 L 900 420 L 900 428" fill="none" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="760" y="413" text-anchor="middle" fill="#718096" font-size="10">WidgetCenter.reloadAllTimelines()</text>

  <!-- Legend -->
  <line x1="60" y1="600" x2="100" y2="600" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)" />
  <text x="108" y="604" fill="#4a5568" font-size="11">calls into / drives</text>
  <line x1="230" y1="600" x2="270" y2="600" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="278" y="604" fill="#718096" font-size="11">shared state / notification (no direct call)</text>

  <text x="60" y="630" fill="#a0aec0" font-size="11">
    batagor (app target)
  </text>
  <text x="760" y="630" fill="#a0aec0" font-size="11">
    widgetExtension (separate target)
  </text>
</svg>
