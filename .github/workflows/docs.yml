name: Deploy DocC documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          # The Liquid Glass views (glassEffect, GlassEffectContainer,
          # glassEffectUnion, .buttonStyle(.glass)) are iOS 26 SDK symbols. They
          # sit behind `if #available(iOS 26, *)` so they don't raise the
          # deployment target, but they still have to *compile*, which needs an
          # Xcode that ships the iOS 26 SDK. Pin it rather than trusting the
          # image default.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 found on the runner image" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build documentation archive
        run: |
          xcodebuild docbuild \
            -project batagor.xcodeproj \
            -scheme batagor \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Convert to a static site
        run: |
          set -euo pipefail
          archive=$(find DerivedData -name "batagor.doccarchive" -maxdepth 6 | head -n 1)
          if [ -z "$archive" ]; then
            echo "No .doccarchive found under DerivedData" >&2
            exit 1
          fi
          "$(xcrun --find docc)" process-archive transform-for-static-hosting \
            "$archive" \
            --output-path site \
            --hosting-base-path a-day

      - name: Add theme settings and redirect site root to the module page
        run: |
          # docc-render fetches theme-settings.json at runtime from the site
          # root — there's no build-time flag for it, just drop it in place.
          cp batagor/Documentation.docc/theme-settings.json site/theme-settings.json
          echo '<meta http-equiv="refresh" content="0; url=./documentation/batagor/">' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
