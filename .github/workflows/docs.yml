name: Deploy DocC documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation archive
        run: |
          xcodebuild docbuild \
            -project batagor.xcodeproj \
            -scheme batagor \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Convert to a static site
        run: |
          set -euo pipefail
          archive=$(find DerivedData -name "batagor.doccarchive" -maxdepth 6 | head -n 1)
          if [ -z "$archive" ]; then
            echo "No .doccarchive found under DerivedData" >&2
            exit 1
          fi
          "$(xcrun --find docc)" process-archive transform-for-static-hosting \
            "$archive" \
            --output-path site \
            --hosting-base-path a-day

      - name: Redirect site root to the module page
        run: |
          echo '<meta http-equiv="refresh" content="0; url=./documentation/batagor/">' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
